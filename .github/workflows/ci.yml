name: VisionCare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: visioncare_test
          POSTGRES_USER: vc
          POSTGRES_PASSWORD: localdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vc -d visioncare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      TEST_DATABASE_URL: postgresql+psycopg://vc:localdev@localhost:5432/visioncare_test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend tests
        run: pytest -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    env:
      DB_PASSWORD: localdev
      DATABASE_URL: postgresql+psycopg://vc:localdev@db:5432/visioncare
      JWT_SECRET: ci-test-secret
      MODEL_VERSION: dr-effb3-v1
      DEMO_MODE: "false"
      NEXT_PUBLIC_DEMO_MODE: "false"
      NEXT_PUBLIC_API_BASE: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f deployment/docker-compose.yml config
