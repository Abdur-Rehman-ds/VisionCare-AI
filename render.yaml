services:
  - type: web
    name: visioncare-model
    runtime: docker
    plan: free
    region: singapore
    rootDir: model-service
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MODEL_VERSION
        value: dr-effb3-v1

  - type: web
    name: visioncare-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visioncare-db
          property: connectionString

      - key: MODEL_SERVICE_URL
        fromService:
          type: web
          name: visioncare-model
          envVarKey: RENDER_EXTERNAL_URL

      - key: JWT_SECRET
        generateValue: true

      - key: DEMO_MODE
        value: "true"

      - key: DEMO_RESET_SECRET
        generateValue: true

      - key: DEMO_ANALYSIS_DAILY_LIMIT
        value: "20"

      - key: CORS_ORIGINS
        value: http://localhost:3000

      - key: UPLOAD_ROOT
        value: /data/uploads

databases:
  - name: visioncare-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: visioncare
    user: vc
    ipAllowList: []
